name: News Crux Intelligence Pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 AM IST
    - cron: '30 11 * * *'  # 05:00 PM IST
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pytz

      - name: Ingest Feeds & Synthesize Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_crux.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-crux.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(briefing): sync latest edition [skip ci]" && git push)
