<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>News Crux</title>
  
  <!-- App Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- Direct Inline Cyan NC Icons (No 404s) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23050508'/><rect x='15' y='15' width='70' height='70' rx='18' fill='%2300d2ff'/><text x='50' y='60' font-family='sans-serif' font-weight='900' font-size='32' fill='%23000' text-anchor='middle'>NC</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23050508'/><rect x='15' y='15' width='70' height='70' rx='18' fill='%2300d2ff'/><text x='50' y='60' font-family='sans-serif' font-weight='900' font-size='32' fill='%23000' text-anchor='middle'>NC</text></svg>">
  
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-backdrop"></div>
  <header class="app-header">
    <div class="brand">
      <div class="logo-orb">NC</div>
      <div>
        <h1 class="brand-title">NEWS CRUX</h1>
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span id="editionLabel">LIVE SYNC</span>
        </div>
      </div>
    </div>
    <div class="lang-switch-3d" id="langSwitch">
      <div class="switch-pill">
        <span class="lang-opt active" id="optEN">EN</span>
        <span class="lang-opt" id="optHI">हि</span>
        <div class="pill-slider" id="pillSlider"></div>
      </div>
    </div>
  </header>

  <nav class="chips-scroller">
    <button class="chip active" data-cat="all" id="chipAll">ALL (45)</button>
    <button class="chip" data-cat="breaking" id="chipBreaking">🔴 BREAKING (10)</button>
    <button class="chip" data-cat="india" id="chipIndia">🇮🇳 INDIA (5)</button>
    <button class="chip" data-cat="finance" id="chipFinance">📊 FINANCE (10)</button>
    <button class="chip" data-cat="crypto" id="chipCrypto">🪙 CRYPTO (10)</button>
    <button class="chip" data-cat="viral" id="chipViral">🔥 VIRAL (10)</button>
  </nav>

  <main class="feed-container" id="feedContainer">
    <div class="loading-state">
      <div class="spinner-3d"></div>
      <p id="loadingText">Synthesizing briefing...</p>
    </div>
  </main>

  <script src="app.js"></script>
  
  <!-- Mandatory Service Worker Registration for PWA Standalone Mode -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Crux Engine PWA Ready:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
