  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#glow)" filter="url(#shadow)"/>
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">NC</text>
